<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | MAT LEADS AI PRO X</title>
    <meta name="description" content="Reset your MAT LEADS AI PRO X account password by email.">
    <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-visual">
        <a class="brand" href="/index.html"><img src="/assets/logo-mark.svg" alt="" width="34" height="34"><span>MAT LEADS AI PRO X</span></a>
        <h1>Set a new password.</h1>
        <p>We'll email you a secure link to reset your password. The link expires shortly after it's sent.</p>
      </section>
      <section class="auth-panel">
        <h2>Forgot password</h2>
        <p>Enter the email on your account.</p>
        <form data-forgot-form>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <button class="btn btn-primary" type="submit">Send reset link</button>
          <div class="notice" data-form-status role="status">You'll receive a reset email if this address has an account.</div>
          <a class="btn btn-ghost" href="/login.html">Back to login</a>
        </form>
      </section>
    </main>
    <script type="module" src="/components/layout.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
